<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>1001TRINKETS</title>
<style>
  @font-face {
    font-family: 'SimSun';
    src: url('simsun.ttc');
    font-weight: normal;
    font-style: normal;
  }

  /* ============================================
     CONFIGURATION — adjust these values easily
     ============================================ */
  :root {
    --outline-thickness: 1px;
    --outline-color-idle: rgba(0, 0, 255, 1);
    --outline-color-hover: white;
    --hover-transition-speed: 0s;
    --window-border-color: rgb(255, 255, 255);
    --window-border-width: 1px;
    --window-bg: #000;
    --lock-unlocked-color: rgb(255, 255, 255);
  }

  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #000;
    font-family: 'SimSun', 'Times New Roman', serif;
    color: #fff;
  }

  /* ============================================
     SCENE CONTAINER — maintains 16:9 aspect
     ============================================ */
  .scene {
    position: relative;
    width: 100vw;
    height: 56.25vw;
    max-height: 100vh;
    max-width: 177.78vh;
    margin: auto;
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
  }

  .scene video {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    object-fit: contain;
    display: block;
  }

  /* ============================================
     SVG HOTSPOT LAYER
     ============================================ */
  .hotspot-layer {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
  }

  .hotspot-layer svg {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
  }

  .hotspot-layer svg polygon,
  .hotspot-layer svg circle,
  .hotspot-layer svg ellipse,
  .hotspot-layer svg path {
    pointer-events: all;
    cursor: pointer;
    fill: transparent;
    stroke: var(--outline-color-idle);
    stroke-width: var(--outline-thickness);
    stroke-miterlimit: 10;
    vector-effect: non-scaling-stroke;
  }

  .hotspot-layer svg:hover polygon,
  .hotspot-layer svg.hotspot-active polygon,
  .hotspot-layer svg:hover circle,
  .hotspot-layer svg.hotspot-active circle,
  .hotspot-layer svg:hover ellipse,
  .hotspot-layer svg.hotspot-active ellipse,
  .hotspot-layer svg:hover path,
  .hotspot-layer svg.hotspot-active path {
    stroke: var(--outline-color-hover);
  }

  /* Indicator-only overlays — visible but click-through */
  .hotspot-layer.indicator-only,
  .hotspot-layer.indicator-only svg,
  .hotspot-layer.indicator-only svg polygon,
  .hotspot-layer.indicator-only svg circle,
  .hotspot-layer.indicator-only svg ellipse,
  .hotspot-layer.indicator-only svg path {
    pointer-events: none !important;
    cursor: default;
  }

  /* Hover glow driven by parent window hover */
  .info-window:hover .hotspot-layer.indicator-only svg polygon,
  .info-window:hover .hotspot-layer.indicator-only svg circle,
  .info-window:hover .hotspot-layer.indicator-only svg ellipse,
  .info-window:hover .hotspot-layer.indicator-only svg path {
    stroke: var(--outline-color-hover);
  }

  /* ============================================
     SUB-HUB CONTENT (image + SVG overlays)
     ============================================ */
  .sub-hub-wrap {
    position: relative;
    width: 100%;
    height: 100%;
  }

  .sub-hub-wrap img {
    width: 100%;
    height: 100%;
    display: block;
  }

  .sub-hub-wrap .hotspot-layer {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
  }

  .sub-hub-wrap .hotspot-layer svg {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
  }

  .sub-hub-wrap .hotspot-layer svg polygon,
  .sub-hub-wrap .hotspot-layer svg circle,
  .sub-hub-wrap .hotspot-layer svg ellipse,
  .sub-hub-wrap .hotspot-layer svg path {
    pointer-events: all;
    cursor: pointer;
    fill: transparent;
    stroke: var(--outline-color-idle);
    stroke-width: var(--outline-thickness);
    stroke-miterlimit: 10;
    vector-effect: non-scaling-stroke;
  }

  .sub-hub-wrap .hotspot-layer svg:hover polygon,
  .sub-hub-wrap .hotspot-layer svg:hover circle,
  .sub-hub-wrap .hotspot-layer svg:hover ellipse,
  .sub-hub-wrap .hotspot-layer svg:hover path {
    stroke: var(--outline-color-hover);
  }

  /* ============================================
     LOCK INTERFACES
     ============================================ */
  .lock-wrap {
    position: relative;
    width: 100%;
    height: 100%;
    background: #000;
    font-family: 'SimSun', 'Times New Roman', serif;
    color: #fff;
  }

  /* The SVG fills the window and sets proportions */
  .lock-wrap svg.lock-svg {
    display: block;
    width: 100%;
    height: 100%;
  }

  .lock-wrap svg.lock-svg path,
  .lock-wrap svg.lock-svg polygon,
  .lock-wrap svg.lock-svg circle {
    fill: none;
    stroke: var(--outline-color-idle);
    stroke-miterlimit: 10;
    vector-effect: non-scaling-stroke;
  }

  /* Mechanism overlay — sits on top of SVG, positioned via % */
  .lock-mechanism {
    position: absolute;
    pointer-events: none;
  }

  .lock-mechanism > * {
    pointer-events: all;
  }

  /* ---- Code lock drums ---- */
  .drum-stack {
    display: flex;
    flex-direction: column;
    gap: 4px;
  }

  .drum {
    display: flex;
    align-items: center;
    gap: 2px;
  }

  .drum-left, .drum-right {
    background: none;
    border: 1px solid var(--outline-color-idle);
    color: var(--outline-color-idle);
    font-size: 10px;
    width: 18px;
    height: 20px;
    cursor: pointer;
    padding: 0;
    font-family: inherit;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .drum-left:hover, .drum-right:hover {
    border-color: var(--outline-color-hover);
    color: var(--outline-color-hover);
  }

  .drum-val {
    font-size: 14px;
    width: 24px;
    height: 20px;
    text-align: center;
    line-height: 20px;
    border: 1px solid var(--outline-color-idle);
    color: var(--outline-color-hover);
  }

  /* ---- Grid lock buttons ---- */
  .grid-3x3 {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 6px;
  }

  .grid-btn {
    width: 22px;
    height: 22px;
    background: transparent;
    border: 1px solid var(--outline-color-idle);
    cursor: pointer;
    font-family: 'SimSun', 'Times New Roman', serif;
    font-size: 14px;
    color: var(--outline-color-hover);
    padding: 0;
    line-height: 22px;
    text-align: center;
  }

  .grid-btn:hover {
    border-color: var(--outline-color-hover);
  }

  /* ---- Key lock keyhole ---- */
  .keyhole-svg {
    cursor: pointer;
  }

  .keyhole-svg circle,
  .keyhole-svg polygon {
    fill: none;
    stroke: var(--outline-color-idle);
    stroke-width: 1;
  }

  .keyhole-svg:hover circle,
  .keyhole-svg:hover polygon {
    stroke: var(--outline-color-hover);
  }

  /* ---- Lock console — fixed on screen ---- */
  #lock-console {
    position: absolute;
    left: 20px;
    top: 120px;
    width: 220px;
    max-height: 300px;
    pointer-events: none;
    z-index: 200;
    display: none;
  }

  #lock-console-log {
    overflow-y: auto;
    max-height: 300px;
    padding: 0;
    font-family: 'SimSun', 'Times New Roman', serif;
    font-size: 11px;
    color: rgba(255, 255, 255, 0.5);
    line-height: 1.5;
  }

  /* ============================================
     VIDEO CONTENT
     ============================================ */
  .video-wrap {
    width: 100%;
    height: 100%;
  }

  .video-wrap video {
    width: 100%;
    height: 100%;
    display: block;
  }

  /* ============================================
     WINDOW LAYER
     ============================================ */
  .window-layer {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
    z-index: 100;
  }

  /* ============================================
     INFO WINDOWS
     ============================================ */
  .info-window {
    position: absolute;
    background: var(--window-bg);
    border: var(--window-border-width) solid var(--window-border-color);
    pointer-events: all;
  }

  .info-window-titlebar {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 36px;
    cursor: grab;
    user-select: none;
    z-index: 1;
  }

  .info-window-titlebar:active {
    cursor: grabbing;
  }

  .info-window-close {
    position: absolute;
    top: 6px;
    left: 8px;
    background: none;
    border: none;
    color: blue;
    font-size: 14px;
    cursor: pointer;
    line-height: 1;
    padding: 2px 4px;
    font-family: 'SimSun', 'Times New Roman', serif;
    text-decoration: underline;
    z-index: 2;
  }

  .info-window-close:hover {
    color: #fff;
  }

  .info-window-content {
    width: 100%;
    height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 30px 20px 20px 20px;
    overflow: hidden;
  }

  .info-window-content.has-iframe {
    padding: 0;
    align-items: flex-start;
    justify-content: flex-start;
    position: relative;
  }

  .info-window-content.has-iframe iframe {
    position: absolute;
    top: 0;
    left: 0;
  }

  .info-window-title {
    font-size: 16px;
    font-weight: 400;
    color: #fff;
    font-family: 'SimSun', 'Times New Roman', serif;
  }

  .info-window-content iframe {
    border: none;
    transform-origin: top left;
  }
</style>
</head>

<script>
  // ---- INTRO ----
  (function() {
    const overlay = document.getElementById('intro-overlay');
    const idleVid = document.getElementById('intro-idle');
    const enterVid = document.getElementById('intro-entering');
    const introBtn = document.getElementById('intro-btn');
    const hubVid = document.getElementById('hub-video');
    let introDone = false;

    function fadeToHub() {
      if (introDone) return;
      introDone = true;
      enterVid.pause();
      idleVid.pause();
      overlay.style.transition = 'opacity 0.5s';
      overlay.style.opacity = '0';
      hubVid.play();
      setTimeout(() => { overlay.remove(); }, 500);
    }

    // Button click → play entering video
    const introRect = introBtn.querySelector('rect');
    introRect.addEventListener('click', () => {
      introBtn.style.display = 'none';
      idleVid.pause();
      idleVid.style.display = 'none';
      enterVid.style.display = '';
      enterVid.play();
    });

    // Entering video ends → fade to hub
    enterVid.addEventListener('ended', fadeToHub);

    // Esc skips straight to hub
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') fadeToHub();
    });
  })();

  const scene = document.getElementById('scene');
  const windowLayer = document.getElementById('windowLayer');

  // ---- CONFIG ----
  const EDGE_SIZE = 10;
  const MIN_WIDTH = 150;
  const MIN_HEIGHT = 100;

  // ---- Z-INDEX MANAGEMENT ----
  let topZ = 200;

  function bringToFront(win) {
    topZ++;
    win.style.zIndex = topZ;
  }

  // ---- TRACK OPEN WINDOWS ----
  const openWindows = {};  // keyed by data-name

  // ---- WINDOW FACTORY ----
  function createWindow(config) {
    // If already open, just bring to front
    if (openWindows[config.name]) {
      bringToFront(openWindows[config.name]);
      return;
    }

    const win = document.createElement('div');
    win.className = 'info-window';
    win.style.width = config.width + 'px';
    win.style.height = config.height + 'px';

    // Offset each new window slightly so they don't stack exactly
    const offset = Object.keys(openWindows).length * 30;
    const sceneRect = scene.getBoundingClientRect();
    win.style.left = (sceneRect.width / 2 - config.width / 2 + offset) + 'px';
    win.style.top = (sceneRect.height / 2 - config.height / 2 + offset) + 'px';

    // Titlebar
    const titlebar = document.createElement('div');
    titlebar.className = 'info-window-titlebar';
    win.appendChild(titlebar);

    // Close button
    const closeBtn = document.createElement('button');
    closeBtn.className = 'info-window-close';
    closeBtn.textContent = '[close]';
    win.appendChild(closeBtn);

    // Content
    const content = document.createElement('div');
    content.className = 'info-window-content';
    win.appendChild(content);

    // Fill content
    if (config.contentBuilder) {
      config.contentBuilder(content, config);
    } else if (config.src) {
      content.classList.add('has-iframe');
      const iframe = document.createElement('iframe');
      iframe.style.width = (config.nativeWidth || 1280) + 'px';
      iframe.style.height = (config.nativeHeight || 720) + 'px';
      iframe.src = config.src;
      iframe.allow = 'autoplay';
      content.appendChild(iframe);
    } else {
      const title = document.createElement('span');
      title.className = 'info-window-title';
      title.textContent = config.name;
      content.appendChild(title);
    }

    // Store window state
    const state = {
      maxWidth: config.maxWidth || Infinity,
      maxHeight: config.maxHeight || Infinity,
      nativeWidth: config.nativeWidth || 0,
      nativeHeight: config.nativeHeight || 0,
      svg: config.svg
    };

    // Add to DOM
    windowLayer.appendChild(win);
    openWindows[config.name] = win;
    bringToFront(win);

    // Scale iframe if present
    if (config.src) {
      requestAnimationFrame(() => scaleIframe(win, state));
    }

    // Mark SVG as active
    if (config.svg) config.svg.classList.add('hotspot-active');

    // ---- CLOSE ----
    closeBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      destroyWindow(config.name);
    });

    // ---- BRING TO FRONT ON CLICK ----
    win.addEventListener('mousedown', () => bringToFront(win));

    // ---- DRAG ----
    let isDragging = false;
    let dragOX = 0, dragOY = 0;

    titlebar.addEventListener('mousedown', (e) => {
      if (win._resizeCorner) return;
      isDragging = true;
      dragOX = e.clientX - win.getBoundingClientRect().left;
      dragOY = e.clientY - win.getBoundingClientRect().top;
      bringToFront(win);
      e.preventDefault();
    });

    // ---- RESIZE (corners only, proportional, skip top-left) ----
    let isResizing = false;
    win._resizeCorner = null;
    let rsStartX, rsStartY, rsStartW, rsStartH, rsStartLeft, rsStartTop;

    const cornerCursors = { 'ne': 'ne-resize', 'se': 'se-resize', 'sw': 'sw-resize' };

    function onMouseMove(e) {
      if (isDragging) {
        const parentRect = windowLayer.getBoundingClientRect();
        win.style.left = (e.clientX - dragOX - parentRect.left) + 'px';
        win.style.top = (e.clientY - dragOY - parentRect.top) + 'px';
        return;
      }
      if (isResizing) {
        const dx = e.clientX - rsStartX;
        const dy = e.clientY - rsStartY;
        let scale = 1;
        if (win._resizeCorner === 'se') scale = 1 + (dx + dy) / (rsStartW + rsStartH);
        if (win._resizeCorner === 'ne') scale = 1 + (dx - dy) / (rsStartW + rsStartH);
        if (win._resizeCorner === 'sw') scale = 1 + (-dx + dy) / (rsStartW + rsStartH);

        let newW = rsStartW * scale;
        let newH = rsStartH * scale;
        if (newW < MIN_WIDTH || newH < MIN_HEIGHT) return;
        if (newW > state.maxWidth || newH > state.maxHeight) return;

        let newLeft = rsStartLeft;
        let newTop = rsStartTop;
        if (win._resizeCorner === 'sw') newLeft = rsStartLeft + (rsStartW - newW);
        if (win._resizeCorner === 'ne') newTop = rsStartTop + (rsStartH - newH);

        win.style.width = newW + 'px';
        win.style.height = newH + 'px';
        win.style.left = newLeft + 'px';
        win.style.top = newTop + 'px';
        scaleIframe(win, state);
        scaleTvIframe(win);
        scaleLockMechanism(win);
        return;
      }
      // Detect corners for cursor
      const rect = win.getBoundingClientRect();
      const x = e.clientX - rect.left;
      const y = e.clientY - rect.top;
      const w = rect.width;
      const h = rect.height;

      const nearLeft = x >= 0 && x <= EDGE_SIZE;
      const nearRight = x >= w - EDGE_SIZE && x <= w;
      const nearTop = y >= 0 && y <= EDGE_SIZE;
      const nearBottom = y >= h - EDGE_SIZE && y <= h;

      let corner = null;
      if (nearTop && nearRight) corner = 'ne';
      else if (nearBottom && nearRight) corner = 'se';
      else if (nearBottom && nearLeft) corner = 'sw';

      if (corner) {
        win.style.cursor = cornerCursors[corner];
        win._resizeCorner = corner;
      } else {
        win.style.cursor = '';
        win._resizeCorner = null;
      }
    }

    win.addEventListener('mousedown', (e) => {
      if (!win._resizeCorner) return;
      e.preventDefault();
      e.stopPropagation();
      isResizing = true;
      const rect = win.getBoundingClientRect();
      const parentRect = windowLayer.getBoundingClientRect();
      rsStartX = e.clientX;
      rsStartY = e.clientY;
      rsStartW = rect.width;
      rsStartH = rect.height;
      rsStartLeft = rect.left - parentRect.left;
      rsStartTop = rect.top - parentRect.top;
      bringToFront(win);
    });

    function onMouseUp() {
      isDragging = false;
      isResizing = false;
    }

    // Store cleanup references
    win._onMouseMove = onMouseMove;
    win._onMouseUp = onMouseUp;
    document.addEventListener('mousemove', onMouseMove);
    document.addEventListener('mouseup', onMouseUp);
  }

  // ---- IFRAME SCALING ----
  function scaleIframe(win, state) {
    const content = win.querySelector('.info-window-content');
    const iframe = content ? content.querySelector('iframe') : null;
    if (!iframe || !state.nativeWidth) return;
    const contentRect = content.getBoundingClientRect();
    const scale = contentRect.width / state.nativeWidth;
    iframe.style.transform = 'scale(' + scale + ')';
    win.style.height = (state.nativeHeight * scale) + 'px';
  }

  // Scale TV iframe (used by toggleTvScreen and resize)
  function scaleTvIframe(win) {
    if (!win._tvNativeWidth) return;
    const content = win.querySelector('.info-window-content');
    const iframe = content ? content.querySelector('iframe') : null;
    if (!iframe) return;
    const contentRect = content.getBoundingClientRect();
    const scale = contentRect.width / win._tvNativeWidth;
    iframe.style.transform = 'scale(' + scale + ')';
    win.style.height = (win._tvNativeHeight * scale) + 'px';
  }

  // Scale lock mechanism proportionally with window
  function scaleLockMechanism(win) {
    if (!win._lockRefWidth) return;
    const mech = win.querySelector('.lock-mechanism');
    if (!mech) return;
    const scale = win.getBoundingClientRect().width / win._lockRefWidth;
    mech.style.transform = 'translate(-50%, -50%) scale(' + scale + ')';
  }

  // ---- DESTROY WINDOW ----
  function destroyWindow(name) {
    const win = openWindows[name];
    if (!win) return;
    // Remove event listeners
    document.removeEventListener('mousemove', win._onMouseMove);
    document.removeEventListener('mouseup', win._onMouseUp);
    // Remove SVG active state
    const svg = document.querySelector('.hotspot-layer svg[data-name="' + name + '"]');
    if (svg) svg.classList.remove('hotspot-active');
    // Remove from DOM
    win.remove();
    delete openWindows[name];
  }

    // Mechanism overlay
    const mech = document.createElement('div');
    mech.className = 'lock-mechanism';
    mech.style.top = lockLayout.code.top;
    mech.style.left = lockLayout.code.left;
    mech.style.transform = 'translate(-50%, -50%)';

    const stack = document.createElement('div');
    stack.className = 'drum-stack';
    for (let i = 0; i < 3; i++) {
      const drum = document.createElement('div');
      drum.className = 'drum';
      drum.dataset.idx = i;
      drum.innerHTML = '<button class="drum-left">&lt;</button><div class="drum-val">' + st.drums[i] + '</div><button class="drum-right">&gt;</button>';
      stack.appendChild(drum);
    }
    mech.appendChild(stack);
    wrap.appendChild(mech);
    content.appendChild(wrap);

    wrap.querySelectorAll('.drum').forEach(drum => {
      const idx = parseInt(drum.dataset.idx);
      const valEl = drum.querySelector('.drum-val');
      drum.querySelector('.drum-left').addEventListener('click', () => {
        if (st.unlocked) return;
        st.drums[idx] = st.drums[idx] <= 1 ? 9 : st.drums[idx] - 1;
        valEl.textContent = st.drums[idx];
        lockLog('Lock I drum ' + (idx+1) + ' → ' + st.drums[idx]);
        checkLock1();
      });
      drum.querySelector('.drum-right').addEventListener('click', () => {
        if (st.unlocked) return;
        st.drums[idx] = st.drums[idx] >= 9 ? 1 : st.drums[idx] + 1;
        valEl.textContent = st.drums[idx];
        lockLog('Lock I drum ' + (idx+1) + ' → ' + st.drums[idx]);
        checkLock1();
      });
    });

    function checkLock1() {
      if (st.drums[0] === st.code[0] && st.drums[1] === st.code[1] && st.drums[2] === st.code[2]) {
        st.unlocked = true;
        swapLockSVG('lock1-svg', 'code');
        lockLog('Lock I UNLOCKED');
      }
    }
  }

  // ---- LOCK 2: 3x3 grid code (sequence-based) ----
  function buildLock2Content(content) {
    content.style.padding = '0';
    const st = lockState.lock2;
    const wrap = document.createElement('div');
    wrap.className = 'lock-wrap';

    // SVG base
    wrap.appendChild(buildLockSVG('lock2-svg', 'grid', st.unlocked));

    // Mechanism overlay
    const mech = document.createElement('div');
    mech.className = 'lock-mechanism';
    mech.style.top = lockLayout.grid.top;
    mech.style.left = lockLayout.grid.left;
    mech.style.transform = 'translate(-50%, -50%)';

    const grid = document.createElement('div');
    grid.className = 'grid-3x3';
    const btns = [];
    for (let i = 0; i < 9; i++) {
      const btn = document.createElement('button');
      btn.className = 'grid-btn';
      btn.dataset.idx = i;
      grid.appendChild(btn);
      btns.push(btn);
    }
    mech.appendChild(grid);
    wrap.appendChild(mech);
    content.appendChild(wrap);

    function resetGrid() {
      st.sequence = [];
      btns.forEach(b => { b.textContent = ''; b.classList.remove('grid-on'); });
    }

    btns.forEach(btn => {
      const idx = parseInt(btn.dataset.idx);
      const cellNum = idx + 1;
      btn.addEventListener('click', () => {
        if (st.unlocked) return;
        if (btn.classList.contains('grid-on')) return;

        st.sequence.push(cellNum);
        btn.textContent = 'x';
        btn.classList.add('grid-on');
        lockLog('Lock II cell ' + cellNum);

        if (st.sequence.length >= 4) {
          const match = st.code.length === st.sequence.length && st.code.every(v => st.sequence.includes(v));
          if (match) {
            st.unlocked = true;
            swapLockSVG('lock2-svg', 'grid');
            lockLog('Lock II UNLOCKED');
          } else {
            lockLog('Lock II wrong code — reset');
            setTimeout(resetGrid, 400);
          }
        }
      });
    });
  }

  // ---- LOCK 3: Key lock ----
  function buildLock3Content(content) {
    content.style.padding = '0';
    const st = lockState.lock3;
    const wrap = document.createElement('div');
    wrap.className = 'lock-wrap';

    // SVG base
    wrap.appendChild(buildLockSVG('lock3-svg', 'key', st.unlocked));

    // Mechanism overlay — keyhole click area
    const mech = document.createElement('div');
    mech.className = 'lock-mechanism';
    mech.style.top = lockLayout.key.top;
    mech.style.left = lockLayout.key.left;
    mech.style.transform = 'translate(-50%, -50%)';

    const keySvg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
    keySvg.setAttribute('viewBox', '0 0 100 100');
    keySvg.classList.add('keyhole-svg');
    keySvg.setAttribute('width', '100');
    keySvg.setAttribute('height', '100');
    keySvg.innerHTML = '<circle cx="50" cy="40" r="12" fill="none" stroke="rgba(0,0,255,0.5)" stroke-width="1.5"/>' +
      '<polygon points="42,48 58,48 54,72 46,72" fill="none" stroke="rgba(0,0,255,0.5)" stroke-width="1.5"/>';
    mech.appendChild(keySvg);
    wrap.appendChild(mech);
    content.appendChild(wrap);

    keySvg.addEventListener('click', () => {
      if (st.unlocked) return;
      if (!st.hasKey) {
        lockLog('Lock III — key required');
        return;
      }
      st.unlocked = true;
      swapLockSVG('lock3-svg', 'key');
      lockLog('Lock III UNLOCKED');
    });
  }


  // Back panel: plays video once, shows notebook SVG on last frame
  function buildBackPanelContent(content) {
    content.style.padding = '0';
    const wrap = document.createElement('div');
    wrap.className = 'sub-hub-wrap';

    // Video — plays once, stops on last frame
    const video = document.createElement('video');
    video.src = 'back_panel10s.mp4';
    video.autoplay = true;
    video.muted = true;
    video.playsInline = true;
    video.loop = false;
    video.style.width = '100%';
    video.style.height = '100%';
    video.style.display = 'block';
    wrap.appendChild(video);

    // Hotspot layer — hidden initially
    const hl = document.createElement('div');
    hl.className = 'hotspot-layer';
    hl.style.opacity = '0';
    hl.style.transition = 'opacity 0.3s';

    const nbSvg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
    nbSvg.setAttribute('viewBox', '0 0 1280 720');
    nbSvg.setAttribute('xmlns', 'http://www.w3.org/2000/svg');
    const nbPoly = document.createElementNS('http://www.w3.org/2000/svg', 'polygon');
    nbPoly.setAttribute('points', '208.84 103.98 215.27 103.98 268.25 106.81 300.91 108.09 301.94 110.66 301.94 202.99 207.04 206.08 208.84 103.98');
    nbSvg.appendChild(nbPoly);
    hl.appendChild(nbSvg);
    wrap.appendChild(hl);
    content.appendChild(wrap);

    // Show notebook SVG after 10.2 seconds
    setTimeout(() => {
      hl.style.opacity = '1';
    }, 10200);

    // Also show on video end as fallback
    video.addEventListener('ended', () => {
      hl.style.opacity = '1';
    });

    // Notebook click — pages cascade + key on first page
    let notebookBusy = false;
    nbPoly.addEventListener('click', (e) => {
      e.stopPropagation();
      if (notebookBusy) return;
      notebookBusy = true;

      // Build page list — first page depends on whether key has been picked up
      const pageCount = 27;
      var pages = [];
      var firstPage = lockState.lock3.hasKey
        ? 'notebook_dither/notebook01.png'
        : 'notebook_dither/notebook01_key.png';
      pages.push(firstPage);
      for (var p = 2; p <= pageCount; p++) {
        var num = p < 10 ? '0' + p : '' + p;
        pages.push('notebook_dither/notebook' + num + '.png');
      }

      const popups = [];
      const sceneRect = scene.getBoundingClientRect();
      const popupW = 420;
      const popupH = Math.round(popupW * (534 / 720));

      function spawnPopup(i) {
        if (i >= pages.length) return;

        const pop = document.createElement('div');
        pop.className = 'info-window error-popup';
        pop.style.width = popupW + 'px';
        pop.style.height = popupH + 'px';

        // Semi-random position within scene bounds
        const maxX = sceneRect.width - popupW - 20;
        const maxY = sceneRect.height - popupH - 20;
        const cx = sceneRect.width / 2 - popupW / 2;
        const cy = sceneRect.height / 2 - popupH / 2;
        const spread = Math.min(i * 10, Math.min(maxX, maxY) / 2);
        const angle = (i * 137.5) * Math.PI / 180;
        const px = Math.max(10, Math.min(maxX, cx + Math.cos(angle) * spread));
        const py = Math.max(10, Math.min(maxY, cy + Math.sin(angle) * spread));
        pop.style.left = px + 'px';
        pop.style.top = py + 'px';

        // Titlebar
        const titlebar = document.createElement('div');
        titlebar.className = 'info-window-titlebar';
        pop.appendChild(titlebar);

        // Close button
        const closeBtn = document.createElement('button');
        closeBtn.className = 'info-window-close';
        closeBtn.textContent = '[close]';
        pop.appendChild(closeBtn);

        // Page image content
        const body = document.createElement('div');
        body.className = 'info-window-content';
        body.style.padding = '0';
        body.style.position = 'relative';
        const img = document.createElement('img');
        img.src = pages[i];
        img.style.width = '100%';
        img.style.height = '100%';
        img.style.objectFit = 'cover';
        img.style.display = 'block';
        body.appendChild(img);

        // Key page (index 0): overlay notebook_key.svg if key not yet picked up
        if (i === 0 && !lockState.lock3.hasKey) {
          const keyHL = document.createElement('div');
          keyHL.className = 'hotspot-layer';
          const keySvg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
          keySvg.setAttribute('viewBox', '0 0 720 534');
          keySvg.setAttribute('xmlns', 'http://www.w3.org/2000/svg');
          const keyPath = document.createElementNS('http://www.w3.org/2000/svg', 'path');
          keyPath.setAttribute('d', 'M604.95,233.18l-4.32-7.35-4.75-6.7-7.83-5.79-8.38-2.64h-11.02l-12.53,3.24-9.94,6.48-6.91,9.07-2.59,12.31,1.08,13.61,6.7,13.39,7.78,9.29.65,3.89-11.02,40.83-7.56,1.3-2.59,4.54h-4.32l-2.38,4.75h-3.02v3.67l3.46,2.59,3.24,4.1,1.08,4.1,3.89,4.54,2.16,1.94,18.36,3.67,18.15-71.94,2.81-3.67,7.35-1.3,7.99-3.67,8.86-7.56,4.1-6.91,3.24-8.43v-10.8l-1.73-10.59ZM585.29,244.63l-11.88-1.3-13.39-4.97-9.72-7.78,4.32-3.67,5.62-4.32,9.07-1.94h8.64l8.81,4.14,5.66,5.37,3.67,5.83.86,6.91-11.67,1.73Z');
          keySvg.appendChild(keyPath);
          keyHL.appendChild(keySvg);
          body.appendChild(keyHL);

          // Key SVG click — pick up the key
          keyPath.addEventListener('click', (ev) => {
            ev.stopPropagation();
            lockState.lock3.hasKey = true;
            lockLog('picked up the key');
            // Swap image to notebook01.png (without key)
            img.src = 'notebook_dither/notebook01.png';
            // Remove key overlay
            keyHL.remove();
          });
        }

        pop.appendChild(body);

        windowLayer.appendChild(pop);
        topZ++;
        pop.style.zIndex = topZ;
        popups.push(pop);

        // Drag via titlebar
        let dragging = false, dox = 0, doy = 0;
        titlebar.addEventListener('mousedown', (me) => {
          dragging = true;
          dox = me.clientX - pop.getBoundingClientRect().left;
          doy = me.clientY - pop.getBoundingClientRect().top;
          topZ++;
          pop.style.zIndex = topZ;
          me.preventDefault();
        });
        document.addEventListener('mousemove', (me) => {
          if (!dragging) return;
          const pr = windowLayer.getBoundingClientRect();
          pop.style.left = (me.clientX - dox - pr.left) + 'px';
          pop.style.top = (me.clientY - doy - pr.top) + 'px';
        });
        document.addEventListener('mouseup', () => { dragging = false; });

        // Close button — auto-close all above the first page, then close first page
        closeBtn.addEventListener('click', (ev) => {
          ev.stopPropagation();

          if (popups.length === 1) {
            // Last remaining page — close it
            pop.remove();
            popups.pop();
            notebookBusy = false;
            return;
          }

          // Auto-close all popups in reverse, except the first one
          let delay = 0;
          while (popups.length > 1) {
            const p = popups.pop();
            ((el, d) => {
              setTimeout(() => { el.remove(); }, d);
            })(p, delay);
            delay += 60;
          }
        });

        // Spawn next after delay
        setTimeout(() => spawnPopup(i + 1), 80);
      }

      // Start the chaos
      spawnPopup(0);
    });
  }

  // ---- HOTSPOT CLICKS ----
  document.querySelectorAll('.hotspot-layer svg').forEach(svg => {
    svg.querySelectorAll('polygon').forEach(poly => {
      poly.addEventListener('click', (e) => {
        e.stopPropagation();
        const name = svg.getAttribute('data-name');

        // Special handling for tv_panel — opens sub-hub
        if (name === 'tv_panel') {
          createWindow({
            name: 'tv_panel',
            width: 384,
            height: 528,
            svg: svg,
            contentBuilder: buildTvPanelContent
          });
          return;
        }

        // Special handling for back_door — lock video sub-hub
        if (name === 'back_door') {
          createWindow({
            name: 'back_door',
            width: 480,
            height: 405,
            svg: svg,
            contentBuilder: buildBackDoorContent
          });
          return;
        }

        // Special handling for back_panel
        if (name === 'back_panel') {
          createWindow({
            name: 'back_panel',
            width: 640,
            height: 360,
            svg: svg,
            contentBuilder: buildBackPanelContent
          });
          return;
        }

        createWindow({
          name: name,
          width: parseInt(svg.getAttribute('data-width')) || 600,
          height: parseInt(svg.getAttribute('data-height')) || 400,
          maxWidth: parseInt(svg.getAttribute('data-max-width')) || Infinity,
          maxHeight: parseInt(svg.getAttribute('data-max-height')) || Infinity,
          src: svg.getAttribute('data-src'),
          nativeWidth: parseInt(svg.getAttribute('data-native-width')) || 1280,
          nativeHeight: parseInt(svg.getAttribute('data-native-height')) || 720,
          svg: svg
        });
      });
    });
  });

  // ---- ESCAPE closes topmost window ----
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') {
      let topName = null;
      let topZval = 0;
      for (const [name, win] of Object.entries(openWindows)) {
        const z = parseInt(win.style.zIndex) || 0;
        if (z > topZval) { topZval = z; topName = name; }
      }
      if (topName) destroyWindow(topName);
    }
  });
</script>

</body>
</html>
